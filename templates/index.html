<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Diary</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    /* ── RESET & ROOT ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d10;
      --surface:   #15151a;
      --surface2:  #1c1c24;
      --border:    #2a2a36;
      --accent:    #c8a96e;
      --accent2:   #7c6fa0;
      --text:      #e8e4dc;
      --muted:     #6e6a7c;
      --danger:    #c06060;
      --success:   #5a9e7a;
      --pending:   #c8a96e;
      --radius:    12px;
      --mono:      'DM Mono', monospace;
      --serif:     'Cormorant Garamond', serif;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* ── LAYOUT ── */
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      grid-column: 1 / -1;
      padding: 20px 36px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }
    header h1 span { color: var(--accent); font-style: italic; }
    .header-date {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* ── SIDEBAR ── */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Calendar */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .calendar-header h2 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.06em;
    }
    .cal-nav {
      background: none; border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    .cal-nav:hover { color: var(--text); background: var(--surface2); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .cal-day-label {
      text-align: center;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
      padding: 4px 0;
      letter-spacing: 0.06em;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.72rem;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .cal-day:hover { background: var(--surface2); }
    .cal-day.empty { cursor: default; }
    .cal-day.today { background: rgba(200,169,110,0.15); color: var(--accent); font-weight: 600; }
    .cal-day.selected { outline: 1px solid var(--accent); }
    .cal-day::after {
      content: '';
      position: absolute;
      bottom: 3px; left: 50%;
      transform: translateX(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      display: none;
    }
    .cal-day.status-complete::after   { display: block; background: var(--success);  }
    .cal-day.status-pending::after    { display: block; background: var(--pending);  }
    .cal-day.status-incomplete::after { display: block; background: var(--danger);   }

    /* Legend */
    .legend {
      display: flex; flex-direction: column; gap: 6px;
    }
    .legend-title {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.82rem; color: var(--muted);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── MAIN ── */
    main {
      padding: 36px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── PANELS ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      animation: fadeUp 0.35s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .panel-title {
      font-size: 0.72rem;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .big-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
    .empty-state p { font-size: 1rem; font-style: italic; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #a8873e);
      color: #1a1408;
      font-weight: 600;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── CHAT ── */
    .chat-box {
      display: flex; flex-direction: column;
      gap: 14px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 6px;
      scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      display: flex; gap: 12px;
      animation: fadeUp 0.25s ease;
    }
    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
    }
    .msg.assistant .msg-avatar { background: linear-gradient(135deg, var(--accent2), var(--accent)); }
    .msg.user .msg-avatar      { background: var(--surface2); border: 1px solid var(--border); }
    .msg.user { flex-direction: row-reverse; }
    .msg-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.55;
    }
    .msg.assistant .msg-bubble { background: var(--surface2); border-radius: 4px 12px 12px 12px; }
    .msg.user      .msg-bubble { background: rgba(200,169,110,0.12); border: 1px solid rgba(200,169,110,0.2); border-radius: 12px 4px 12px 12px; }

    .chat-input-row {
      display: flex; gap: 10px;
      margin-top: 16px;
    }
    .chat-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--serif);
      font-size: 1rem;
      padding: 10px 14px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input:focus { border-color: var(--accent2); }

    /* Typing indicator */
    .typing { display: flex; align-items: center; gap: 4px; padding: 8px 0; }
    .typing span {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ── EMOTION BADGE ── */
    .emotion-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: rgba(124,111,160,0.15);
      border: 1px solid rgba(124,111,160,0.3);
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--accent2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── DIARY TEXT ── */
    .diary-text {
      font-size: 1.05rem;
      font-style: italic;
      line-height: 1.8;
      color: var(--text);
      border-left: 2px solid var(--accent);
      padding-left: 18px;
      margin: 16px 0;
    }

    /* ── MUSIC CLIPS ── */
    .clips-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .clip-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 10px;
    }
    .clip-card:hover { border-color: var(--accent); background: rgba(200,169,110,0.06); }
    .clip-card.selected { border-color: var(--success); background: rgba(90,158,122,0.1); }
    .clip-icon { font-size: 1.4rem; flex-shrink: 0; }
    .clip-label { font-size: 0.82rem; font-family: var(--mono); color: var(--muted); }

    /* ── PAST ENTRY VIEW ── */
    .past-emotion-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .past-music-player {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 14px;
      margin-top: 14px;
    }
    .music-note-anim {
      font-size: 1.4rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.92)} }

    /* ── NOTIFICATION ── */
    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.3s;
      pointer-events: none;
      z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ═══════════════════════════════════════════
       EMOTION CONTROL PANEL
       ═══════════════════════════════════════════ */

    .ecp-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 12px 0 4px;
      user-select: none;
    }
    .ecp-toggle-label {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .ecp-toggle-arrow {
      font-size: 0.7rem;
      color: var(--muted);
      transition: transform 0.25s;
    }
    .ecp-toggle-arrow.open { transform: rotate(90deg); }
    .ecp-toggle-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, var(--accent), transparent);
      opacity: 0.3;
    }

    .ecp-body {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
      margin-top: 0;
    }
    .ecp-body.open {
      max-height: 900px;
      opacity: 1;
      margin-top: 18px;
    }

    /* Emotion pad container */
    .ecp-pad-wrap {
      position: relative;
      width: 100%;
      max-width: 340px;
      margin: 0 auto 20px;
    }
    .ecp-pad {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      cursor: crosshair;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(200,169,110,0.15);
      touch-action: none;
      user-select: none;
      background:
        radial-gradient(ellipse at 80% 20%, rgba(255,200,80,0.18), transparent 55%),
        radial-gradient(ellipse at 20% 80%, rgba(200,60,60,0.12), transparent 50%),
        radial-gradient(ellipse at 20% 20%, rgba(80,120,200,0.14), transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(90,180,120,0.12), transparent 50%),
        var(--surface2);
    }
    .ecp-pad-label {
      position: absolute;
      font-family: var(--mono);
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .ecp-emotion-dot {
      position: absolute;
      transform: translate(-50%, 50%);
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: none;
      transition: color 0.2s, text-shadow 0.2s;
    }
    .ecp-emotion-dot.nearest {
      color: var(--accent) !important;
      text-shadow: 0 0 8px rgba(200,169,110,0.4);
    }
    .ecp-cursor {
      position: absolute;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,169,110,0.9), rgba(200,169,110,0.25));
      box-shadow: 0 0 16px rgba(200,169,110,0.35);
      transform: translate(-50%, 50%);
      pointer-events: none;
      transition: left 0.1s ease-out, bottom 0.1s ease-out;
    }
    .ecp-cursor.dragging { transition: none; }

    .ecp-detected {
      text-align: center;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--muted);
      font-style: italic;
    }
    .ecp-detected strong {
      color: var(--accent);
      font-style: normal;
      text-transform: capitalize;
    }

    /* Attribute sliders */
    .ecp-sliders { margin-top: 8px; }
    .ecp-slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
    }
    .ecp-slider-icon {
      width: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .ecp-slider-lo, .ecp-slider-hi {
      width: 54px;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .ecp-slider-hi { text-align: right; }
    .ecp-slider-track {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      background: rgba(200,169,110,0.15);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .ecp-slider-track::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px rgba(200,169,110,0.3);
      cursor: pointer;
    }
    .ecp-slider-track::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      box-shadow: 0 0 6px rgba(200,169,110,0.3);
      cursor: pointer;
    }

    /* Prompt preview */
    .ecp-prompt-preview {
      margin-top: 16px;
      padding: 12px 14px;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.6;
    }
    .ecp-prompt-preview .ecp-prompt-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(200,169,110,0.5);
      margin-bottom: 6px;
    }

    .ecp-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }

    /* Regenerating overlay */
    .ecp-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
      padding: 10px 0;
    }
    .ecp-spinner {
      width: 16px; height: 16px;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo-icon">♪</div>
    <h1>Music <span>Diary</span></h1>
    <div class="header-date" id="headerDate"></div>
  </header>

  <!-- SIDEBAR -->
  <aside>
    <div>
      <div class="calendar-header">
        <h2 id="calTitle"></h2>
        <div style="display:flex;gap:4px">
          <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
          <button class="cal-nav" onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="legend">
      <div class="legend-title">Status</div>
      <div class="legend-item"><div class="dot" style="background:var(--success)"></div> Complete</div>
      <div class="legend-item"><div class="dot" style="background:var(--pending)"></div> In progress</div>
      <div class="legend-item"><div class="dot" style="background:var(--danger)"></div> Unfinished</div>
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="startNewEntry()">
      ✦ New Entry
    </button>
  </aside>

  <!-- MAIN -->
  <main id="mainContent">
    <div class="empty-state">
      <div class="big-icon">♫</div>
      <p>Select a date or start a new entry<br>to begin your music diary.</p>
    </div>
  </main>

</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  EMOTION CONTROL PANEL – data & helpers
// ══════════════════════════════════════════════
const EMOTIONS_MAP = {
  happy:       { x: 0.75, y: 0.75 },
  excited:     { x: 0.88, y: 0.88 },
  calm:        { x: 0.60, y: 0.18 },
  romantic:    { x: 0.70, y: 0.32 },
  hopeful:     { x: 0.68, y: 0.58 },
  nostalgic:   { x: 0.32, y: 0.28 },
  melancholic: { x: 0.22, y: 0.18 },
  sad:         { x: 0.15, y: 0.12 },
  angry:       { x: 0.18, y: 0.88 },
  other:       { x: 0.50, y: 0.50 },
};

const ATTR_DEFS = [
  { key:'tempo',      label:'Tempo',      lo:'Slower',  hi:'Faster',   icon:'◎' },
  { key:'brightness', label:'Brightness', lo:'Darker',  hi:'Brighter', icon:'◈' },
  { key:'complexity', label:'Complexity', lo:'Sparse',  hi:'Dense',    icon:'◇' },
  { key:'intensity',  label:'Intensity',  lo:'Gentle',  hi:'Powerful', icon:'△' },
];

// Current control-panel state (updated by UI interactions)
let ecpState = { padX:0.5, padY:0.5, tempo:0.5, brightness:0.5, complexity:0.5, intensity:0.5 };

function ecpNearestEmotion(x, y) {
  let best = 'other', bestD = Infinity;
  for (const [name, pos] of Object.entries(EMOTIONS_MAP)) {
    const d = Math.hypot(pos.x - x, pos.y - y);
    if (d < bestD) { bestD = d; best = name; }
  }
  return best;
}

function ecpBuildPrompt() {
  const emo = ecpNearestEmotion(ecpState.padX, ecpState.padY);
  const adj = [];
  if (ecpState.tempo > 0.65)      adj.push('uptempo');
  else if (ecpState.tempo < 0.35) adj.push('slow');
  if (ecpState.brightness > 0.65)      adj.push('bright');
  else if (ecpState.brightness < 0.35) adj.push('dark');
  if (ecpState.complexity > 0.65)      adj.push('richly layered');
  else if (ecpState.complexity < 0.35) adj.push('minimal');
  if (ecpState.intensity > 0.65)      adj.push('powerful');
  else if (ecpState.intensity < 0.35) adj.push('gentle');

  const prefix = adj.length > 0 ? adj.join(', ') + ' ' : '';
  return `${prefix}${emo} instrumental music`;
}

function ecpRefreshUI() {
  // Update cursor
  const cursor = document.getElementById('ecpCursor');
  if (cursor) {
    cursor.style.left   = (ecpState.padX * 100) + '%';
    cursor.style.bottom = (ecpState.padY * 100) + '%';
  }

  // Highlight nearest emotion label
  const nearest = ecpNearestEmotion(ecpState.padX, ecpState.padY);
  document.querySelectorAll('.ecp-emotion-dot').forEach(el => {
    el.classList.toggle('nearest', el.dataset.emotion === nearest);
  });

  // Detected label
  const det = document.getElementById('ecpDetected');
  if (det) det.innerHTML = `Detected: <strong>${nearest}</strong>`;

  // Prompt preview
  const pp = document.getElementById('ecpPromptText');
  if (pp) pp.textContent = ecpBuildPrompt();
}

// ── STATE ──────────────────────────────────────
let currentYear, currentMonth;
let selectedDate = null;
let sessionId    = null;
let conversationDone = false;
let generatedData    = null;
let selectedClipId   = null;
let selectedClipUrl  = null;
let currentAudio     = null;
let entries = {};

const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const DAY_LABELS = ["Su","Mo","Tu","We","Th","Fr","Sa"];

// ── INIT ──────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth();
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  loadEntries();
});

async function loadEntries() {
  const res = await fetch('/api/entries');
  entries = await res.json();
  renderCalendar();
}

// ── CALENDAR ──────────────────────────────────
function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  renderCalendar();
}

function renderCalendar() {
  const grid  = document.getElementById('calGrid');
  const title = document.getElementById('calTitle');
  title.textContent = `${MONTHS[currentMonth]} ${currentYear}`;
  grid.innerHTML = '';

  DAY_LABELS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-label';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.textContent = d;

    if (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear())
      el.classList.add('today');
    if (dateStr === selectedDate) el.classList.add('selected');

    const entry = entries[dateStr];
    if (entry) {
      if (entry.status === 'complete')           el.classList.add('status-complete');
      else if (entry.status === 'pending_music') el.classList.add('status-pending');
      else                                        el.classList.add('status-incomplete');
    }

    el.addEventListener('click', () => selectDate(dateStr, entry));
    grid.appendChild(el);
  }
}

// ── SELECT DATE ───────────────────────────────
async function selectDate(dateStr, existingEntry) {
  selectedDate = dateStr;
  renderCalendar();

  if (existingEntry) {
    showExistingEntry(dateStr, existingEntry);
  } else {
    showEmptyDatePanel(dateStr);
  }
}

// ── PANELS ────────────────────────────────────
function setMain(html) {
  const audioEl = document.getElementById('clipAudio');
  if (audioEl) { audioEl.pause(); audioEl.src = ''; }

  const main = document.getElementById('mainContent');
  main.innerHTML = html;
}

function showEmptyDatePanel(dateStr) {
  const friendly = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US',
    {weekday:'long', month:'long', day:'numeric'});
  setMain(`
    <div class="panel">
      <div class="panel-title">📅 ${friendly}</div>
      <div class="empty-state">
        <div class="big-icon">✦</div>
        <p style="margin-bottom:24px">No diary entry for this day yet.</p>
        <button class="btn btn-primary" onclick="startNewEntry('${dateStr}')">✦ Start Diary Entry</button>
      </div>
    </div>
  `);
}

function showExistingEntry(dateStr, entry) {
  const friendly = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US',
    {weekday:'long', month:'long', day:'numeric'});

  let musicHtml = entry.music_url
    ? `<div class="past-music-player">
        <span class="music-note-anim">♪</span>
        <div>
          <div style="font-family:var(--mono);font-size:0.7rem;color:var(--muted);margin-bottom:4px">SOUNDTRACK</div>
          <audio controls src="${entry.music_url}" style="width:260px;accent-color:var(--accent)"></audio>
        </div>
      </div>`
    : `<div style="color:var(--muted);font-size:0.85rem;margin-top:12px;font-family:var(--mono)">No soundtrack selected.</div>`;

  setMain(`
    <div class="panel">
      <div class="panel-title">📖 ${friendly}</div>
      <div class="past-emotion-row">
        <div class="emotion-badge">◈ ${entry.emotion}</div>
        <span style="font-family:var(--mono);font-size:0.72rem;color:var(--muted)">dominant emotion</span>
      </div>
      <div class="diary-text">${entry.summary}</div>
      ${musicHtml}
    </div>
  `);
}

// ── NEW ENTRY FLOW ────────────────────────────
async function startNewEntry(dateStr) {
  dateStr = dateStr || str(new Date());
  if (!dateStr || dateStr === 'undefined') {
    const now = new Date();
    dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  }
  selectedDate = dateStr;
  sessionId = null;
  conversationDone = false;
  generatedData = null;
  selectedClipId = null;

  const friendly = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US',
    {weekday:'long', month:'long', day:'numeric'});

  setMain(`
    <div class="panel" id="chatPanel">
      <div class="panel-title">💬 ${friendly} — Guided Journal</div>
      <div class="chat-box" id="chatBox"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" rows="2"
          placeholder="Share your thoughts…"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button class="btn btn-primary" onclick="sendMsg()" id="sendBtn">Send</button>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-secondary" onclick="loadEntries()" >Cancel</button>
        <button class="btn btn-primary" id="generateBtn" disabled onclick="generateEntry()">✦ Generate Diary</button>
      </div>
    </div>
  `);

  appendTyping();
  const res  = await fetch('/api/chat/start', {method:'POST'});
  const data = await res.json();
  sessionId  = data.session_id;
  removeTyping();
  appendMsg('assistant', data.message);
}

function str(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function sendMsg() {
  if (conversationDone) return;
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';
  appendMsg('user', text);

  document.getElementById('sendBtn').disabled    = true;
  document.getElementById('generateBtn').disabled = true;
  appendTyping();

  const res  = await fetch('/api/chat/message', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, message: text})
  });
  const data = await res.json();
  removeTyping();
  appendMsg('assistant', data.message);
  document.getElementById('sendBtn').disabled = false;

  if (data.done) {
    conversationDone = true;
    document.getElementById('sendBtn').disabled     = true;
    document.getElementById('generateBtn').disabled = false;
    document.getElementById('chatInput').disabled   = true;
    document.getElementById('chatInput').placeholder = 'Conversation complete — click Generate Diary!';
  } else {
    document.getElementById('generateBtn').disabled = false;
  }
}

function appendMsg(role, content) {
  const box = document.getElementById('chatBox');
  const avatarEmoji = role === 'assistant' ? '♪' : '✦';
  box.insertAdjacentHTML('beforeend', `
    <div class="msg ${role}">
      <div class="msg-avatar">${avatarEmoji}</div>
      <div class="msg-bubble">${escHtml(content)}</div>
    </div>
  `);
  box.scrollTop = box.scrollHeight;
}

function appendTyping() {
  const box = document.getElementById('chatBox');
  box.insertAdjacentHTML('beforeend', `
    <div class="msg assistant" id="typingIndicator">
      <div class="msg-avatar">♪</div>
      <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>
  `);
  box.scrollTop = box.scrollHeight;
}

function removeTyping() {
  document.getElementById('typingIndicator')?.remove();
}

// ── GENERATE ─────────────────────────────────
async function generateEntry() {
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('generateBtn').textContent = '… Generating';

  const res  = await fetch('/api/generate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, date: selectedDate})
  });
  generatedData = await res.json();
  entries[selectedDate] = { ...generatedData, status: 'pending_music' };
  renderCalendar();
  showGenerateResult(generatedData);
}

// ══════════════════════════════════════════════
//  SHOW GENERATION RESULT + EMOTION CONTROL PANEL
// ══════════════════════════════════════════════
function showGenerateResult(data) {
  const friendly = new Date(data.date + 'T00:00:00').toLocaleDateString('en-US',
    {weekday:'long', month:'long', day:'numeric'});

  // Seed the ECP state from the detected emotion
  const emoPos = EMOTIONS_MAP[data.emotion] || EMOTIONS_MAP.other;
  ecpState = { padX: emoPos.x, padY: emoPos.y, tempo:0.5, brightness:0.5, complexity:0.5, intensity:0.5 };

  // Build clip cards HTML
  const clipsHtml = buildClipsHtml(data.clips);

  // Build emotion-dot labels for the 2D pad
  let emotionDotsHtml = '';
  for (const [name, pos] of Object.entries(EMOTIONS_MAP)) {
    emotionDotsHtml += `<div class="ecp-emotion-dot" data-emotion="${name}"
      style="left:${pos.x*100}%;bottom:${pos.y*100}%;color:var(--muted)">${name}</div>`;
  }

  // Build slider rows
  let slidersHtml = '';
  for (const a of ATTR_DEFS) {
    slidersHtml += `
      <div class="ecp-slider-row">
        <span class="ecp-slider-icon">${a.icon}</span>
        <span class="ecp-slider-lo">${a.lo}</span>
        <input type="range" min="0" max="100" value="50" class="ecp-slider-track"
               id="ecpSlider_${a.key}" oninput="onEcpSlider('${a.key}', this.value)"/>
        <span class="ecp-slider-hi">${a.hi}</span>
      </div>`;
  }

  setMain(`
    <!-- Diary review -->
    <div class="panel">
      <div class="panel-title">📖 ${friendly} — Review Entry</div>
      <div class="past-emotion-row">
        <div class="emotion-badge">◈ ${escHtml(data.emotion)}</div>
        <span style="font-family:var(--mono);font-size:0.72rem;color:var(--muted)">dominant emotion</span>
      </div>
      <div class="diary-text">${escHtml(data.summary)}</div>
    </div>

    <!-- Soundtrack selection -->
    <div class="panel" id="soundtrackPanel">
      <div class="panel-title">🎵 Choose Your Soundtrack</div>
      <p style="font-size:0.9rem;color:var(--muted);margin-bottom:14px">
        Four tracks were generated for your emotion. Select the one that resonates most.
      </p>

      <div id="clipPlayerRow" class="past-music-player" style="margin-bottom:16px">
        <span class="music-note-anim">♪</span>
        <div>
          <div style="font-family:var(--mono);font-size:0.7rem;color:var(--muted);margin-bottom:4px">NOW PLAYING</div>
          <audio controls id="clipAudio" style="width:260px;accent-color:var(--accent)"></audio>
        </div>
      </div>
      <div class="clips-grid" id="clipsGrid">${clipsHtml}</div>

      <!-- ── Emotion Control Panel toggle ── -->
      <div class="ecp-toggle" onclick="toggleEcp()">
        <span class="ecp-toggle-arrow open" id="ecpArrow">▸</span>
        <span class="ecp-toggle-label">Not quite right? Shape your sound</span>
        <span class="ecp-toggle-line"></span>
      </div>

      <div class="ecp-body open" id="ecpBody">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start">
          <!-- Left: 2D Emotion Pad -->
          <div>
            <div style="font-family:var(--mono);font-size:0.62rem;color:var(--muted);
                        letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px">
              Emotion Space
            </div>
            <div class="ecp-pad-wrap">
              <div class="ecp-pad" id="ecpPad">
                <div class="ecp-pad-label" style="bottom:6px;left:50%;transform:translateX(-50%)">VALENCE →</div>
                <div class="ecp-pad-label" style="left:6px;top:50%;transform:translateY(-50%) rotate(-90deg)">ENERGY →</div>
                ${emotionDotsHtml}
                <div class="ecp-cursor" id="ecpCursor"></div>
              </div>
            </div>
            <div class="ecp-detected" id="ecpDetected"></div>
          </div>

          <!-- Right: Attribute Sliders -->
          <div>
            <div style="font-family:var(--mono);font-size:0.62rem;color:var(--muted);
                        letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px">
              Attributes
            </div>
            <div class="ecp-sliders">${slidersHtml}</div>
          </div>
        </div>

        <!-- Prompt preview -->
        <div class="ecp-prompt-preview">
          <div class="ecp-prompt-label">Generated Prompt</div>
          <div id="ecpPromptText"></div>
        </div>

        <!-- Loading state (hidden by default) -->
        <div class="ecp-loading" id="ecpLoading" style="display:none">
          <div class="ecp-spinner"></div>
          <span>Regenerating clips…</span>
        </div>

        <!-- Regenerate button -->
        <div class="ecp-actions">
          <button class="btn btn-primary" id="ecpRegenBtn" onclick="regenerateMusic()">
            ✦ Regenerate with these settings
          </button>
        </div>

      </div><!-- /ecp-body -->

      <!-- Save / Discard -->
      <div style="margin-top:20px;display:flex;justify-content:flex-end;gap:10px">
        <button class="btn btn-secondary" onclick="loadEntries()">Discard</button>
        <button class="btn btn-primary" id="saveBtn" disabled onclick="saveEntry()">✦ Save Diary Entry</button>
      </div>
    </div>
  `);

  // Wire up the 2D pad interactions
  initEcpPad();

  // Seed UI
  ecpRefreshUI();

  // Auto-play first clip
  if (data.clips && data.clips.length > 0) {
    selectClip(data.clips[0].id, data.clips[0].url);
  }
}

// ── Build clip card HTML from an array ───────
function buildClipsHtml(clips) {
  return clips.map(c => `
    <div class="clip-card" id="clip-${c.id}" onclick="selectClip(${c.id},'${escAttr(c.url)}')">
      <div class="clip-icon">♫</div>
      <div>
        <div class="clip-label">${escHtml(c.label)}</div>
        <div style="font-size:0.72rem;color:var(--muted);font-family:var(--mono);margin-top:2px">select to preview</div>
      </div>
    </div>
  `).join('');
}

// ── ECP toggle open/close ────────────────────
function toggleEcp() {
  const body  = document.getElementById('ecpBody');
  const arrow = document.getElementById('ecpArrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

// ── ECP 2D pad pointer handling ──────────────
function initEcpPad() {
  const pad = document.getElementById('ecpPad');
  if (!pad) return;

  let dragging = false;

  function update(e) {
    const r = pad.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    ecpState.padX = Math.max(0, Math.min(1, (cx - r.left) / r.width));
    ecpState.padY = Math.max(0, Math.min(1, 1 - (cy - r.top) / r.height));

    const cursor = document.getElementById('ecpCursor');
    if (cursor) cursor.classList.add('dragging');

    ecpRefreshUI();
  }

  pad.addEventListener('mousedown',  e => { dragging = true; update(e); });
  pad.addEventListener('touchstart', e => { dragging = true; update(e); }, {passive:true});
  window.addEventListener('mousemove', e => { if (dragging) update(e); });
  window.addEventListener('touchmove', e => { if (dragging) { e.preventDefault(); update(e); } }, {passive:false});
  window.addEventListener('mouseup',  () => {
    dragging = false;
    const cursor = document.getElementById('ecpCursor');
    if (cursor) cursor.classList.remove('dragging');
  });
  window.addEventListener('touchend', () => {
    dragging = false;
    const cursor = document.getElementById('ecpCursor');
    if (cursor) cursor.classList.remove('dragging');
  });
}

// ── ECP slider handler ───────────────────────
function onEcpSlider(key, val) {
  ecpState[key] = val / 100;
  ecpRefreshUI();
}

// ══════════════════════════════════════════════
//  REGENERATE MUSIC  (calls /api/regenerate)
// ══════════════════════════════════════════════
async function regenerateMusic() {
  const btn     = document.getElementById('ecpRegenBtn');
  const loading = document.getElementById('ecpLoading');
  btn.disabled = true;
  btn.textContent = '… Regenerating';
  loading.style.display = 'flex';

  const emotion = ecpNearestEmotion(ecpState.padX, ecpState.padY);
  const prompt  = ecpBuildPrompt();

  try {
    const res = await fetch('/api/regenerate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ date: selectedDate, emotion, prompt }),
    });
    const data = await res.json();

    if (data.error) {
      toast('Error: ' + data.error);
      return;
    }

    // Replace clips in the grid
    const grid = document.getElementById('clipsGrid');
    if (grid) grid.innerHTML = buildClipsHtml(data.clips);

    // Reset selection
    selectedClipId  = null;
    selectedClipUrl = null;
    document.getElementById('saveBtn').disabled = true;

    // Update the emotion badge in the diary panel
    generatedData.emotion = data.emotion;
    generatedData.clips   = data.clips;

    // Auto-play first new clip
    if (data.clips && data.clips.length > 0) {
      selectClip(data.clips[0].id, data.clips[0].url);
    }

    toast('✦ New clips generated!');
  } catch (err) {
    toast('Regeneration failed — see console');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = '✦ Regenerate with these settings';
    loading.style.display = 'none';
  }
}

// ── CLIP SELECT & SAVE ───────────────────────
function selectClip(id, url) {
  selectedClipId  = id;
  selectedClipUrl = url;

  document.querySelectorAll('.clip-card').forEach(c => c.classList.remove('selected'));
  document.getElementById(`clip-${id}`)?.classList.add('selected');

  const audioEl = document.getElementById('clipAudio');
  if (audioEl) {
    audioEl.src = url;
    audioEl.play().catch(err => console.warn("Autoplay blocked:", err));
  }

  document.getElementById('saveBtn').disabled = false;
}

async function saveEntry() {
  const res = await fetch('/api/select_music', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({date: selectedDate, clip_id: selectedClipId, clip_url: selectedClipUrl})
  });
  const data = await res.json();
  entries[selectedDate] = data.entry;
  renderCalendar();
  showExistingEntry(selectedDate, data.entry);
  toast('✦ Diary entry saved!');
}

// ── UTILS ─────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
