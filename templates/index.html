<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Diary</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    /* ── RESET & ROOT ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d10;
      --surface:   #15151a;
      --surface2:  #1c1c24;
      --border:    #2a2a36;
      --accent:    #c8a96e;
      --accent2:   #7c6fa0;
      --text:      #e8e4dc;
      --muted:     #6e6a7c;
      --danger:    #c06060;
      --success:   #5a9e7a;
      --pending:   #c8a96e;
      --radius:    12px;
      --mono:      'DM Mono', monospace;
      --serif:     'Cormorant Garamond', serif;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* ── LAYOUT ── */
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      grid-column: 1 / -1;
      padding: 20px 36px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }
    header h1 span { color: var(--accent); font-style: italic; }
    .header-date {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* ── SIDEBAR ── */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Calendar */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .calendar-header h2 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.06em;
    }
    .cal-nav {
      background: none; border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    .cal-nav:hover { color: var(--text); background: var(--surface2); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .cal-day-label {
      text-align: center;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
      padding: 4px 0;
      letter-spacing: 0.06em;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.72rem;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .cal-day:hover { background: var(--surface2); }
    .cal-day.empty { cursor: default; }
    .cal-day.today { background: rgba(200,169,110,0.15); color: var(--accent); font-weight: 600; }
    .cal-day.selected { outline: 1px solid var(--accent); }
    .cal-day::after {
      content: '';
      position: absolute;
      bottom: 3px; left: 50%;
      transform: translateX(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      display: none;
    }
    .cal-day.status-complete::after   { display: block; background: var(--success);  }
    .cal-day.status-pending::after    { display: block; background: var(--pending);  }
    .cal-day.status-incomplete::after { display: block; background: var(--danger);   }

    /* Legend */
    .legend {
      display: flex; flex-direction: column; gap: 6px;
    }
    .legend-title {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.82rem; color: var(--muted);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── MAIN ── */
    main {
      padding: 36px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── PANELS ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      animation: fadeUp 0.35s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .panel-title {
      font-size: 0.72rem;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .big-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
    .empty-state p { font-size: 1rem; font-style: italic; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #a8873e);
      color: #1a1408;
      font-weight: 600;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── CHAT ── */
    .chat-box {
      display: flex; flex-direction: column;
      gap: 14px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 6px;
      scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      display: flex; gap: 12px;
      animation: fadeUp 0.25s ease;
    }
    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
    }
    .msg.assistant .msg-avatar { background: linear-gradient(135deg, var(--accent2), var(--accent)); }
    .msg.user .msg-avatar      { background: var(--surface2); border: 1px solid var(--border); }
    .msg.user { flex-direction: row-reverse; }
    .msg-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.55;
    }
    .msg.assistant .msg-bubble { background: var(--surface2); border-radius: 4px 12px 12px 12px; }
    .msg.user      .msg-bubble { background: rgba(200,169,110,0.12); border: 1px solid rgba(200,169,110,0.2); border-radius: 12px 4px 12px 12px; }

    .chat-input-row {
      display: flex; gap: 10px;
      margin-top: 16px;
    }
    .chat-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--serif);
      font-size: 1rem;
      padding: 10px 14px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input:focus { border-color: var(--accent2); }

    /* Typing indicator */
    .typing { display: flex; align-items: center; gap: 4px; padding: 8px 0; }
    .typing span {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ── EMOTION BADGE ── */
    .emotion-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: rgba(124,111,160,0.15);
      border: 1px solid rgba(124,111,160,0.3);
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--accent2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── DIARY TEXT ── */
    .diary-text {
      font-size: 1.05rem;
      font-style: italic;
      line-height: 1.8;
      color: var(--text);
      border-left: 2px solid var(--accent);
      padding-left: 18px;
      margin: 16px 0;
    }

    /* ── MUSIC CLIPS ── */
    .clips-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .clip-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 10px;
    }
    .clip-card:hover { border-color: var(--accent); background: rgba(200,169,110,0.06); }
    .clip-card.selected { border-color: var(--success); background: rgba(90,158,122,0.1); }
    .clip-icon { font-size: 1.4rem; flex-shrink: 0; }
    .clip-label { font-size: 0.82rem; font-family: var(--mono); color: var(--muted); }

    /* ── PAST ENTRY VIEW ── */
    .past-emotion-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .past-music-player {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 14px;
      margin-top: 14px;
    }
    .music-note-anim {
      font-size: 1.4rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.92)} }

    /* ── NOTIFICATION ── */
    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.3s;
      pointer-events: none;
      z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo-icon">♪</div>
    <h1>Music <span>Diary</span></h1>
    <div class="header-date" id="headerDate"></div>
  </header>

  <!-- SIDEBAR -->
  <aside>
    <div>
      <div class="calendar-header">
        <h2 id="calTitle"></h2>
        <div style="display:flex;gap:4px">
          <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
          <button class="cal-nav" onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="legend">
      <div class="legend-title">Status</div>
      <div class="legend-item"><div class="dot" style="background:var(--success)"></div> Complete</div>
      <div class="legend-item"><div class="dot" style="background:var(--pending)"></div> In progress</div>
      <div class="legend-item"><div class="dot" style="background:var(--danger)"></div> Unfinished</div>
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="startNewEntry()">
      ✦ New Entry
    </button>
  </aside>

  <!-- MAIN -->
  <main id="mainContent">
    <div class="empty-state">
      <div class="big-icon">♫</div>
      <p>Select a date or start a new entry<br>to begin your music diary.</p>
    </div>
  </main>

</div>

<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────
let currentYear, currentMonth;
let selectedDate = null;
let sessionId    = null;
let conversationDone = false;
let generatedData    = null;
let selectedClipId   = null;
let entries = {};

const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const DAY_LABELS = ["Su","Mo","Tu","We","Th","Fr","Sa"];

// ── INIT ──────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth();
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  loadEntries();
});

async function loadEntries() {
  const res = await fetch('/api/entries');
  entries = await res.json();
  renderCalendar();
}

// ── CALENDAR ──────────────────────────────────
function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  renderCalendar();
}

function renderCalendar() {
  const grid  = document.getElementById('calGrid');
  const title = document.getElementById('calTitle');
  title.textContent = `${MONTHS[currentMonth]} ${currentYear}`;
  grid.innerHTML = '';

  DAY_LABELS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-label';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.textContent = d;

    if (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear())
      el.classList.add('today');
    if (dateStr === selectedDate) el.classList.add('selected');

    const entry = entries[dateStr];
    if (entry) {
      if (entry.status === 'complete')           el.classList.add('status-complete');
      else if (entry.status === 'pending_music') el.classList.add('status-pending');
      else                                        el.classList.add('status-incomplete');
    }

    el.addEventListener('click', () => selectDate(dateStr, entry));
    grid.appendChild(el);
  }
}

// ── SELECT DATE ───────────────────────────────
async function selectDate(dateStr, existingEntry) {
  selectedDate = dateStr;
  renderCalendar();

  if (existingEntry) {
    showExistingEntry(dateStr, existingEntry);
  } else {
    showEmptyDatePanel(dateStr);
  }
}

// ── PANELS ────────────────────────────────────
function setMain(html) {
  const main = document.getElementById('mainContent');
  main.innerHTML = html;
}

function showEmptyDatePanel(dateStr) {
  const friendly = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US',
    {weekday:'long', month:'long', day:'numeric'});
  setMain(`
    <div class="panel">
      <div class="panel-title">📅 ${friendly}</div>
      <div class="empty-state">
        <div class="big-icon">✦</div>
        <p style="margin-bottom:24px">No diary entry for this day yet.</p>
        <button class="btn btn-primary" onclick="startNewEntry('${dateStr}')">✦ Start Diary Entry</button>
      </div>
    </div>
  `);
}

function showExistingEntry(dateStr, entry) {
  const friendly = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US',
    {weekday:'long', month:'long', day:'numeric'});

  let musicHtml = entry.music_url
    ? `<div class="past-music-player">
        <span class="music-note-anim">♪</span>
        <div>
          <div style="font-family:var(--mono);font-size:0.7rem;color:var(--muted);margin-bottom:4px">SOUNDTRACK</div>
          <audio controls src="${entry.music_url}" style="width:260px;accent-color:var(--accent)"></audio>
        </div>
      </div>`
    : `<div style="color:var(--muted);font-size:0.85rem;margin-top:12px;font-family:var(--mono)">No soundtrack selected.</div>`;

  setMain(`
    <div class="panel">
      <div class="panel-title">📖 ${friendly}</div>
      <div class="past-emotion-row">
        <div class="emotion-badge">◈ ${entry.emotion}</div>
        <span style="font-family:var(--mono);font-size:0.72rem;color:var(--muted)">dominant emotion</span>
      </div>
      <div class="diary-text">${entry.summary}</div>
      ${musicHtml}
    </div>
  `);
}

// ── NEW ENTRY FLOW ────────────────────────────
async function startNewEntry(dateStr) {
  dateStr = dateStr || str(new Date());
  if (!dateStr || dateStr === 'undefined') {
    const now = new Date();
    dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  }
  selectedDate = dateStr;
  sessionId = null;
  conversationDone = false;
  generatedData = null;
  selectedClipId = null;

  const friendly = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US',
    {weekday:'long', month:'long', day:'numeric'});

  setMain(`
    <div class="panel" id="chatPanel">
      <div class="panel-title">💬 ${friendly} — Guided Journal</div>
      <div class="chat-box" id="chatBox"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" rows="2"
          placeholder="Share your thoughts…"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button class="btn btn-primary" onclick="sendMsg()" id="sendBtn">Send</button>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-secondary" onclick="loadEntries()" >Cancel</button>
        <button class="btn btn-primary" id="generateBtn" disabled onclick="generateEntry()">✦ Generate Diary</button>
      </div>
    </div>
  `);

  // Start session
  appendTyping();
  const res  = await fetch('/api/chat/start', {method:'POST'});
  const data = await res.json();
  sessionId  = data.session_id;
  removeTyping();
  appendMsg('assistant', data.message);
}

function str(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function sendMsg() {
  if (conversationDone) return;
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';
  appendMsg('user', text);

  document.getElementById('sendBtn').disabled    = true;
  document.getElementById('generateBtn').disabled = true;
  appendTyping();

  const res  = await fetch('/api/chat/message', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, message: text})
  });
  const data = await res.json();
  removeTyping();
  appendMsg('assistant', data.message);
  document.getElementById('sendBtn').disabled = false;

  if (data.done) {
    conversationDone = true;
    document.getElementById('sendBtn').disabled     = true;
    document.getElementById('generateBtn').disabled = false;
    document.getElementById('chatInput').disabled   = true;
    document.getElementById('chatInput').placeholder = 'Conversation complete — click Generate Diary!';
  } else {
    document.getElementById('generateBtn').disabled = false;
  }
}

function appendMsg(role, content) {
  const box = document.getElementById('chatBox');
  const avatarEmoji = role === 'assistant' ? '♪' : '✦';
  box.insertAdjacentHTML('beforeend', `
    <div class="msg ${role}">
      <div class="msg-avatar">${avatarEmoji}</div>
      <div class="msg-bubble">${escHtml(content)}</div>
    </div>
  `);
  box.scrollTop = box.scrollHeight;
}

function appendTyping() {
  const box = document.getElementById('chatBox');
  box.insertAdjacentHTML('beforeend', `
    <div class="msg assistant" id="typingIndicator">
      <div class="msg-avatar">♪</div>
      <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>
  `);
  box.scrollTop = box.scrollHeight;
}

function removeTyping() {
  document.getElementById('typingIndicator')?.remove();
}

// ── GENERATE ─────────────────────────────────
async function generateEntry() {
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('generateBtn').textContent = '… Generating';

  const res  = await fetch('/api/generate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, date: selectedDate})
  });
  generatedData = await res.json();
  entries[selectedDate] = { ...generatedData, status: 'pending_music' };
  renderCalendar();
  showGenerateResult(generatedData);
}

function showGenerateResult(data) {
  const friendly = new Date(data.date + 'T00:00:00').toLocaleDateString('en-US',
    {weekday:'long', month:'long', day:'numeric'});

  const clipsHtml = data.clips.map(c => `
    <div class="clip-card" id="clip-${c.id}" onclick="selectClip(${c.id},'${escAttr(c.url)}')">
      <div class="clip-icon">♫</div>
      <div>
        <div class="clip-label">${escHtml(c.label)}</div>
        <div style="font-size:0.72rem;color:var(--muted);font-family:var(--mono);margin-top:2px">10 sec · select to use</div>
      </div>
    </div>
  `).join('');

  setMain(`
    <div class="panel">
      <div class="panel-title">📖 ${friendly} — Review Entry</div>
      <div class="past-emotion-row">
        <div class="emotion-badge">◈ ${data.emotion}</div>
        <span style="font-family:var(--mono);font-size:0.72rem;color:var(--muted)">dominant emotion</span>
      </div>
      <div class="diary-text">${escHtml(data.summary)}</div>
    </div>

    <div class="panel">
      <div class="panel-title">🎵 Choose Your Soundtrack</div>
      <p style="font-size:0.9rem;color:var(--muted);margin-bottom:14px">
        Four tracks were generated for your emotion. Select the one that resonates most.
      </p>
      <div class="clips-grid">${clipsHtml}</div>
      <div style="margin-top:20px;display:flex;justify-content:flex-end;gap:10px">
        <button class="btn btn-secondary" onclick="loadEntries()">Discard</button>
        <button class="btn btn-primary" id="saveBtn" disabled onclick="saveEntry()">✦ Save Diary Entry</button>
      </div>
    </div>
  `);
}

function selectClip(id, url) {
  selectedClipId = id;
  document.querySelectorAll('.clip-card').forEach(c => c.classList.remove('selected'));
  document.getElementById(`clip-${id}`)?.classList.add('selected');
  document.getElementById('saveBtn').disabled = false;
}

async function saveEntry() {
  const res = await fetch('/api/select_music', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({date: selectedDate, clip_id: selectedClipId, clip_url: '#'})
  });
  const data = await res.json();
  entries[selectedDate] = data.entry;
  renderCalendar();
  showExistingEntry(selectedDate, data.entry);
  toast('✦ Diary entry saved!');
}

// ── UTILS ─────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
